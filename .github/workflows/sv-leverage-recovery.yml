name: sv-leverage-recovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Run synthetic SV leverage recovery diagnostic
        run: >-
          python scripts/diagnose_sv_leverage_recovery.py
          --window 1000
          --rho -0.50
          --seed 20260917
          --output-dir diagnostics
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sv-leverage-recovery-synthetic
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 30
