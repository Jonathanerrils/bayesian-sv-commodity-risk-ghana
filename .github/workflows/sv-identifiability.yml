name: sv-identifiability

on:
  pull_request:
    types: [synchronize]
    paths:
      - 'scripts/diagnose_sv_identifiability.py'
      - '.github/workflows/sv-identifiability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        case:
          - oil-sv-t
          - oil-sv-leverage
          - synthetic-sv-t-leverage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Run identifiability diagnostic
        run: >-
          python scripts/diagnose_sv_identifiability.py
          --case "${{ matrix.case }}"
          --window 1000
          --block 0
          --refit-every 42
          --output-dir diagnostics
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sv-identifiability-${{ matrix.case }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 30
