name: w1000-residual-recovery

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  actions: read

env:
  SOURCE_RUN_ID: "37871158815"
  PRIOR_RECOVERY_RUN_ID: "38318956529"
  SECOND_RECOVERY_RUN_ID: "38913509318"
  THIRD_RECOVERY_RUN_ID: "39239545647"
  # A checkpoint artifact must contain a verified, resumable sampler state.
  # Partial CSV output alone cannot resume an interrupted MCMC fit.
  SOURCE_HEAD_SHA: "f121fc79a203a8712ac0efb1310dccd438e0b614"
  WINDOW: "1000"
  REFIT_EVERY: "42"
  PREDICTIVE_DRAWS: "20000"
  TARGET_ACCEPT: "0.99"
  FILTER_RESAMPLE_THRESHOLD: "0.5"
  PYTHONUNBUFFERED: "1"

jobs:
  audit_combined:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'run-w1000-residual-recovery'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      recovery_cocoa: ${{ steps.audit.outputs.recovery_cocoa }}
      recovery_gold: ${{ steps.audit.outputs.recovery_gold }}
      recovery_oil: ${{ steps.audit.outputs.recovery_oil }}
      has_cocoa: ${{ steps.audit.outputs.has_cocoa }}
      has_gold: ${{ steps.audit.outputs.has_gold }}
      has_oil: ${{ steps.audit.outputs.has_oil }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Verify prerequisite runs are complete
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for run_id in "$SOURCE_RUN_ID" "$PRIOR_RECOVERY_RUN_ID" "$SECOND_RECOVERY_RUN_ID" "$THIRD_RECOVERY_RUN_ID"; do
            status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq .status)"
            if [[ "$status" != "completed" ]]; then
              echo "refusing residual recovery: run $run_id is $status" >&2
              exit 1
            fi
          done
      - name: Download original source and first recovery artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p source_run prior_recovery second_recovery third_recovery combined_input
          gh run download "$SOURCE_RUN_ID" -D source_run
          gh run download "$PRIOR_RECOVERY_RUN_ID" -D prior_recovery
          gh run download "$SECOND_RECOVERY_RUN_ID" -D second_recovery
          gh run download "$THIRD_RECOVERY_RUN_ID" -D third_recovery
          find source_run -type f -name '*.csv' -exec cp {} combined_input/ \;
          # Only ingest actual first-wave recovery shard artifacts.  The prior run
          # also contains recovery-source-package with normalized copies of the
          # original source blocks; including those would duplicate source evidence.
          find prior_recovery -type f -path '*/recovery-sv-*/*' -name 'sv__*.csv' -exec cp {} combined_input/ \;
          find second_recovery -type f -path '*/residual-sv-*/*' -name 'sv__*.csv' -exec cp {} combined_input/ \;
          find third_recovery -type f -path '*/residual-sv-*/*' -name 'sv__*.csv' -exec cp {} combined_input/ \;
          plan="$(find source_run -type f -name production_plan.json -print -quit)"
          if [[ -z "$plan" ]]; then
            echo "source run does not contain production_plan.json" >&2
            exit 1
          fi
          cp "$plan" production_plan.json
      - id: audit
        name: Audit combined source plus first and second recovery waves
        run: |
          python scripts/audit_production_recovery.py \
            --plan production_plan.json \
            --input-dir combined_input \
            --audit-json residual_audit.json \
            --recovery-json residual_matrix.json \
            --normalized-dir normalized_combined_sv \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-head-sha "$SOURCE_HEAD_SHA" \
            --refit-every "$REFIT_EVERY" \
            --target-accept "$TARGET_ACCEPT" \
            --filter-resample-threshold "$FILTER_RESAMPLE_THRESHOLD" \
            --backfill-filter-threshold \
            --backfill-validated-source-sha "$SOURCE_HEAD_SHA" \
            --github-output "$GITHUB_OUTPUT"
          python - <<'PY'
          import json
          d=json.load(open("residual_audit.json"))
          print(json.dumps({"counts":d["counts"],"safe_for_automatic_recovery":d["safe_for_automatic_recovery"]}, indent=2))
          if not d["safe_for_automatic_recovery"]:
              raise SystemExit("residual audit is not safe for automatic recovery")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: residual-source-package
          path: |
            production_plan.json
            residual_audit.json
            residual_matrix.json
            normalized_combined_sv/
            combined_input/
          if-no-files-found: error
          retention-days: 30

  recover_cocoa:
    needs: audit_combined
    if: ${{ needs.audit_combined.outputs.has_cocoa == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.audit_combined.outputs.recovery_cocoa) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: |
          python scripts/run_production_shard.py \
            --kind sv --commodity "${{ matrix.commodity }}" --model "${{ matrix.model }}" \
            --start-block "${{ matrix.start_block }}" --n-blocks 1 \
            --window "$WINDOW" --refit-every "$REFIT_EVERY" \
            --predictive-draws "$PREDICTIVE_DRAWS" --target-accept "$TARGET_ACCEPT" \
            --output-dir residual_shards
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: residual-sv-cocoa-${{ matrix.model }}-${{ matrix.start_block }}
          path: residual_shards/
          if-no-files-found: error
          retention-days: 30

  recover_gold:
    needs: audit_combined
    if: ${{ needs.audit_combined.outputs.has_gold == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.audit_combined.outputs.recovery_gold) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: |
          python scripts/run_production_shard.py \
            --kind sv --commodity "${{ matrix.commodity }}" --model "${{ matrix.model }}" \
            --start-block "${{ matrix.start_block }}" --n-blocks 1 \
            --window "$WINDOW" --refit-every "$REFIT_EVERY" \
            --predictive-draws "$PREDICTIVE_DRAWS" --target-accept "$TARGET_ACCEPT" \
            --output-dir residual_shards
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: residual-sv-gold-${{ matrix.model }}-${{ matrix.start_block }}
          path: residual_shards/
          if-no-files-found: error
          retention-days: 30

  recover_oil:
    needs: audit_combined
    if: ${{ needs.audit_combined.outputs.has_oil == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.audit_combined.outputs.recovery_oil) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: |
          python scripts/run_production_shard.py \
            --kind sv --commodity "${{ matrix.commodity }}" --model "${{ matrix.model }}" \
            --start-block "${{ matrix.start_block }}" --n-blocks 1 \
            --window "$WINDOW" --refit-every "$REFIT_EVERY" \
            --predictive-draws "$PREDICTIVE_DRAWS" --target-accept "$TARGET_ACCEPT" \
            --output-dir residual_shards
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: residual-sv-oil-${{ matrix.model }}-${{ matrix.start_block }}
          path: residual_shards/
          if-no-files-found: error
          retention-days: 30
