name: fork-particle-diversity-diagnostic

on:
  push:
    branches:
      - audit/track-sv-particle-diversity
    paths:
      - '.github/run-fork-particle-diversity'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - commodity: oil
            variant: SV-Gaussian
          - commodity: oil
            variant: SV-t
          - commodity: cocoa
            variant: SV-Gaussian
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Trace complete 42-day filter block
        run: >-
          python scripts/diagnose_particle_diversity.py
          --commodity "${{ matrix.commodity }}"
          --variant "${{ matrix.variant }}"
          --block 0
          --window 1000
          --refit-every 42
          --target-accept 0.99
          --output-dir diagnostics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: particle-diversity-${{ matrix.commodity }}-${{ matrix.variant }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 30
