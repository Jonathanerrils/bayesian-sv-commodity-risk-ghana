name: Fork PR7 current-head validation

on:
  push:
    branches:
      - fix/sv-diagnostic-attempt-budget
    paths:
      - ".github/workflows/fork-pr7-current-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Compile diagnostic scripts
        run: >-
          python -m py_compile
          scripts/diagnose_sv_refit.py
          scripts/summarize_sv_split_attempts.py
      - name: Run split-attempt and geometry tests
        run: >-
          python -m pytest -q
          tests/test_sv_split_summary.py
          tests/test_sv_diagnostic_geometry.py
