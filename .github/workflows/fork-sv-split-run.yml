name: fork-sv-v5-split-diagnostic

on:
  push:
    branches:
      - fix/sv-diagnostic-attempt-budget
    paths:
      - '.github/run-fork-sv-split'

permissions:
  contents: read

jobs:
  cocoa_sv_t_attempt1:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      converged: ${{ steps.result.outputs.converged }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Run cocoa SV-t attempt 1
        run: >-
          python scripts/diagnose_sv_refit.py
          --commodity cocoa --variant SV-t --block 0 --attempt 1
          --window 1000 --refit-every 42 --target-accept 0.99
          --allow-nonconverged --output-dir diagnostics
      - id: result
        shell: python
        run: |
          import json, os
          from pathlib import Path
          path = next(Path("diagnostics").glob("*__attempt-1.json"))
          value = str(bool(json.loads(path.read_text())["converged"])).lower()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"converged={value}\n")
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sv-v5-cocoa-SV-t-attempt-1
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 30

  cocoa_sv_t_attempt2:
    needs: cocoa_sv_t_attempt1
    if: always() && needs.cocoa_sv_t_attempt1.outputs.converged != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Run cocoa SV-t attempt 2
        run: >-
          python scripts/diagnose_sv_refit.py
          --commodity cocoa --variant SV-t --block 0 --attempt 2
          --window 1000 --refit-every 42 --target-accept 0.99
          --allow-nonconverged --output-dir diagnostics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sv-v5-cocoa-SV-t-attempt-2
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 30

  gold_sv_t_attempt1:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      converged: ${{ steps.result.outputs.converged }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Run gold SV-t attempt 1
        run: >-
          python scripts/diagnose_sv_refit.py
          --commodity gold --variant SV-t --block 0 --attempt 1
          --window 1000 --refit-every 42 --target-accept 0.99
          --allow-nonconverged --output-dir diagnostics
      - id: result
        shell: python
        run: |
          import json, os
          from pathlib import Path
          path = next(Path("diagnostics").glob("*__attempt-1.json"))
          value = str(bool(json.loads(path.read_text())["converged"])).lower()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"converged={value}\n")
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sv-v5-gold-SV-t-attempt-1
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 30

  gold_sv_t_attempt2:
    needs: gold_sv_t_attempt1
    if: always() && needs.gold_sv_t_attempt1.outputs.converged != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Run gold SV-t attempt 2
        run: >-
          python scripts/diagnose_sv_refit.py
          --commodity gold --variant SV-t --block 0 --attempt 2
          --window 1000 --refit-every 42 --target-accept 0.99
          --allow-nonconverged --output-dir diagnostics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sv-v5-gold-SV-t-attempt-2
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 30

  gate:
    if: always()
    needs:
      - cocoa_sv_t_attempt1
      - cocoa_sv_t_attempt2
      - gold_sv_t_attempt1
      - gold_sv_t_attempt2
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download available attempt artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: sv-v5-*
          path: downloaded_diagnostics
          merge-multiple: true
      - name: Build strict convergence summary
        run: >-
          python scripts/summarize_sv_split_attempts.py
          --artifact-dir downloaded_diagnostics
          --output sv_v5_high_accuracy_summary.json
          --job-status cocoa_SV_t_attempt1=${{ needs.cocoa_sv_t_attempt1.result }}
          --job-status cocoa_SV_t_attempt2=${{ needs.cocoa_sv_t_attempt2.result }}
          --job-status gold_SV_t_attempt1=${{ needs.gold_sv_t_attempt1.result }}
          --job-status gold_SV_t_attempt2=${{ needs.gold_sv_t_attempt2.result }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sv-v5-high-accuracy-summary
          path: sv_v5_high_accuracy_summary.json
          if-no-files-found: error
          retention-days: 30
