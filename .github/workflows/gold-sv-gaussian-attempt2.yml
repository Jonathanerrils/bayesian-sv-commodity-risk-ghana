name: gold-sv-gaussian-attempt2-validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Run production-equivalent Gold SV-Gaussian attempt 2
        run: >-
          python scripts/compare_sv_filter_thresholds.py
          --commodity gold
          --variant SV-Gaussian
          --block 0
          --window 1000
          --refit-every 42
          --target-accept 0.99
          --thresholds 0.5
          --predictive-draws 20000
          --attempt-only 2
          --output-dir diagnostics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-sv-gaussian-attempt2
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 30
