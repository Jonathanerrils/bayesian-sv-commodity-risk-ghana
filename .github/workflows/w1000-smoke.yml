name: w1000-production-smoke

on:
  pull_request:
    paths:
      - "scripts/smoke_w1000.py"
      - "src/sv_model.py"
      - "src/data_utils.py"
      - "requirements.txt"
      - ".github/workflows/w1000-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python scripts/smoke_w1000.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w1000-smoke-artifacts
          path: w1000_smoke_artifacts/
          if-no-files-found: error
