name: sv-leverage-asis-reference

on:
  pull_request:
    paths:
      - 'scripts/diagnose_sv_leverage_asis_reference.R'
      - 'scripts/summarize_sv_leverage_asis_reference.py'
      - '.github/workflows/sv-leverage-asis-reference.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        case: [oil, synthetic]
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::stochvol
            any::coda
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install 'numpy<2.5,>=1.26' 'pandas<3.0,>=2.0' 'arviz<1.0,>=0.20'
      - name: Run stochvol ASIS reference sampler
        run: >-
          Rscript scripts/diagnose_sv_leverage_asis_reference.R
          --case "${{ matrix.case }}"
          --window 1000
          --output-dir diagnostics/asis_reference
      - name: Summarize with project convergence metrics
        run: >-
          python scripts/summarize_sv_leverage_asis_reference.py
          --case "${{ matrix.case }}"
          --input-dir diagnostics/asis_reference
          --output-dir diagnostics/asis_reference
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sv-leverage-asis-reference-${{ matrix.case }}
          path: diagnostics/asis_reference/
          if-no-files-found: warn
          retention-days: 30
