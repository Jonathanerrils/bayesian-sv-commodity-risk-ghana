name: checkpoint-unit-validation

on:
  push:
    branches:
      - audit-fix/residual-recovery-third-wave
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkpoint-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile modified modules
        run: |
          python -m py_compile src/attempt_checkpoint.py src/sv_model.py scripts/run_production_shard.py
      - name: Run checkpoint unit tests
        run: |
          python -m pytest -q tests/test_attempt_checkpoint.py
