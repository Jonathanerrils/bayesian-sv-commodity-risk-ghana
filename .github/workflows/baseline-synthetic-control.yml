name: baseline-synthetic-control

on:
  pull_request:
    paths:
      - '.github/run-baseline-synthetic-control'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python scripts/diagnose_sv_baseline_synthetic_control.py --window 1000 --target-accept 0.99 --random-seed 20260925 --output-dir diagnostics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baseline-synthetic-control
          path: diagnostics/
          if-no-files-found: error
          retention-days: 30
