name: w1000-production-recovery

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Source W=1000 production run to audit/recover
        required: true
        default: "37871158815"
      execute_recovery:
        description: Actually rerun infrastructure-missing blocks and assemble
        required: true
        type: boolean
        default: false
  pull_request:
    types: [labeled]

permissions:
  contents: read
  actions: read

env:
  WINDOW: "1000"
  REFIT_EVERY: "42"
  PREDICTIVE_DRAWS: "20000"
  TARGET_ACCEPT: "0.99"
  FILTER_RESAMPLE_THRESHOLD: "0.5"
  VALIDATED_LEGACY_V7_SHA: "f121fc79a203a8712ac0efb1310dccd438e0b614"
  PYTHONUNBUFFERED: "1"

jobs:
  audit_source:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'audit-w1000-recovery'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      recovery_cocoa: ${{ steps.audit.outputs.recovery_cocoa }}
      recovery_gold: ${{ steps.audit.outputs.recovery_gold }}
      recovery_oil: ${{ steps.audit.outputs.recovery_oil }}
      has_cocoa: ${{ steps.audit.outputs.has_cocoa }}
      has_gold: ${{ steps.audit.outputs.has_gold }}
      has_oil: ${{ steps.audit.outputs.has_oil }}
      source_head_sha: ${{ steps.meta.outputs.source_head_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt

      - id: meta
        name: Read source run metadata
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id || '37871158815' }}
          EXECUTE_RECOVERY: ${{ github.event_name == 'workflow_dispatch' && inputs.execute_recovery || false }}
        run: |
          source_head_sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq .head_sha)"
          source_status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq .status)"
          source_conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq '.conclusion // "null"')"
          echo "source_head_sha=$source_head_sha" >> "$GITHUB_OUTPUT"
          if [[ "$EXECUTE_RECOVERY" == "true" && "$source_status" != "completed" ]]; then
            echo "refusing recovery while source run $SOURCE_RUN_ID is $source_status" >&2
            exit 1
          fi
          printf '{"source_run_id":"%s","source_head_sha":"%s","source_status":"%s","source_conclusion":"%s"}\n' \
            "$SOURCE_RUN_ID" "$source_head_sha" "$source_status" "$source_conclusion" > source_run_metadata.json

      - name: Download source-run artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id || '37871158815' }}
        run: |
          mkdir -p source_run
          gh run download "$SOURCE_RUN_ID" -D source_run

      - id: audit
        name: Audit planned blocks and build exact recovery matrix
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id || '37871158815' }}
          SOURCE_HEAD_SHA: ${{ steps.meta.outputs.source_head_sha }}
        shell: bash
        run: |
          plan="$(find source_run -type f -name production_plan.json -print -quit)"
          if [[ -z "$plan" ]]; then
            echo "source run does not contain production_plan.json" >&2
            exit 1
          fi
          cp "$plan" production_plan.json
          backfill=()
          if [[ "$SOURCE_RUN_ID" == "37871158815" && "$SOURCE_HEAD_SHA" == "$VALIDATED_LEGACY_V7_SHA" ]]; then
            backfill=(--backfill-filter-threshold --backfill-validated-source-sha "$VALIDATED_LEGACY_V7_SHA")
          fi
          python scripts/audit_production_recovery.py \
            --plan production_plan.json \
            --input-dir source_run \
            --audit-json recovery_audit.json \
            --recovery-json recovery_matrix.json \
            --normalized-dir normalized_source_sv \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-head-sha "$SOURCE_HEAD_SHA" \
            --refit-every "$REFIT_EVERY" \
            --target-accept "$TARGET_ACCEPT" \
            --filter-resample-threshold "$FILTER_RESAMPLE_THRESHOLD" \
            --github-output "$GITHUB_OUTPUT" \
            "${backfill[@]}"
          mkdir -p source_benchmarks
          find source_run -type f -name 'benchmark__*.csv' -exec cp {} source_benchmarks/ \;

      - name: Publish source audit summary
        run: |
          echo "## W=1000 recovery source audit" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          python -c 'import json; d=json.load(open("recovery_audit.json")); print(json.dumps({"source_run_id":d["source_run_id"],"source_head_sha":d["source_head_sha"],"counts":d["counts"],"safe_for_automatic_recovery":d["safe_for_automatic_recovery"]}, indent=2))' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: recovery-source-package
          path: |
            production_plan.json
            source_run_metadata.json
            recovery_audit.json
            recovery_matrix.json
            normalized_source_sv/
            source_benchmarks/
          if-no-files-found: error
          retention-days: 30

  recover_cocoa:
    needs: audit_source
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.execute_recovery && needs.audit_source.outputs.has_cocoa == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.audit_source.outputs.recovery_cocoa) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Recover one missing Cocoa block
        run: |
          python scripts/run_production_shard.py \
            --kind sv \
            --commodity "${{ matrix.commodity }}" \
            --model "${{ matrix.model }}" \
            --start-block "${{ matrix.start_block }}" \
            --n-blocks 1 \
            --window "$WINDOW" \
            --refit-every "$REFIT_EVERY" \
            --predictive-draws "$PREDICTIVE_DRAWS" \
            --target-accept "$TARGET_ACCEPT" \
            --output-dir recovery_shards
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-sv-cocoa-${{ matrix.model }}-${{ matrix.start_block }}
          path: recovery_shards/
          if-no-files-found: error
          retention-days: 30

  recover_gold:
    needs: audit_source
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.execute_recovery && needs.audit_source.outputs.has_gold == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.audit_source.outputs.recovery_gold) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Recover one missing Gold block
        run: |
          python scripts/run_production_shard.py \
            --kind sv \
            --commodity "${{ matrix.commodity }}" \
            --model "${{ matrix.model }}" \
            --start-block "${{ matrix.start_block }}" \
            --n-blocks 1 \
            --window "$WINDOW" \
            --refit-every "$REFIT_EVERY" \
            --predictive-draws "$PREDICTIVE_DRAWS" \
            --target-accept "$TARGET_ACCEPT" \
            --output-dir recovery_shards
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-sv-gold-${{ matrix.model }}-${{ matrix.start_block }}
          path: recovery_shards/
          if-no-files-found: error
          retention-days: 30

  recover_oil:
    needs: audit_source
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.execute_recovery && needs.audit_source.outputs.has_oil == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.audit_source.outputs.recovery_oil) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Recover one missing Oil block
        run: |
          python scripts/run_production_shard.py \
            --kind sv \
            --commodity "${{ matrix.commodity }}" \
            --model "${{ matrix.model }}" \
            --start-block "${{ matrix.start_block }}" \
            --n-blocks 1 \
            --window "$WINDOW" \
            --refit-every "$REFIT_EVERY" \
            --predictive-draws "$PREDICTIVE_DRAWS" \
            --target-accept "$TARGET_ACCEPT" \
            --output-dir recovery_shards
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-sv-oil-${{ matrix.model }}-${{ matrix.start_block }}
          path: recovery_shards/
          if-no-files-found: error
          retention-days: 30

  validate_and_assemble:
    needs: [audit_source, recover_cocoa, recover_gold, recover_oil]
    if: >-
      ${{ always() && inputs.execute_recovery &&
          needs.audit_source.result == 'success' &&
          (needs.recover_cocoa.result == 'success' || needs.recover_cocoa.result == 'skipped') &&
          (needs.recover_gold.result == 'success' || needs.recover_gold.result == 'skipped') &&
          (needs.recover_oil.result == 'success' || needs.recover_oil.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: recovery-source-package
          path: source_package
      - name: Download recovered block artifacts
        if: >-
          ${{ needs.audit_source.outputs.has_cocoa == 'true' ||
              needs.audit_source.outputs.has_gold == 'true' ||
              needs.audit_source.outputs.has_oil == 'true' }}
        uses: actions/download-artifact@v4
        with:
          pattern: recovery-sv-*
          path: recovered
          merge-multiple: true
      - name: Combine reusable and recovered shards
        run: |
          mkdir -p combined_input recovered
          find source_package/source_benchmarks -type f -name '*.csv' -exec cp {} combined_input/ \;
          find source_package/normalized_source_sv -type f -name '*.csv' -exec cp {} combined_input/ \;
          find recovered -type f -name 'sv__*.csv' -exec cp {} combined_input/ \;
      - name: Re-audit combined block set
        run: |
          python scripts/audit_production_recovery.py \
            --plan source_package/production_plan.json \
            --input-dir combined_input \
            --audit-json final_recovery_audit.json \
            --recovery-json final_recovery_matrix.json \
            --source-run-id "${{ inputs.source_run_id || '37871158815' }}" \
            --source-head-sha "${{ needs.audit_source.outputs.source_head_sha }}" \
            --refit-every "$REFIT_EVERY" \
            --target-accept "$TARGET_ACCEPT" \
            --filter-resample-threshold "$FILTER_RESAMPLE_THRESHOLD"
          python -c 'import json,sys; m=json.load(open("final_recovery_matrix.json")); n=sum(len(v) for v in m.values()); print(f"remaining infrastructure-missing blocks: {n}"); sys.exit(1 if n else 0)'
      - name: Assemble canonical recovered package
        run: |
          python scripts/assemble_production_run.py \
            --input-dir combined_input \
            --output-dir production_package \
            --window "$WINDOW" \
            --refit-every "$REFIT_EVERY" \
            --predictive-draws "$PREDICTIVE_DRAWS" \
            --target-accept "$TARGET_ACCEPT"
      - uses: actions/upload-artifact@v4
        with:
          name: w1000-recovered-production-results
          path: |
            production_package/
            final_recovery_audit.json
            final_recovery_matrix.json
          if-no-files-found: error
          retention-days: 90
