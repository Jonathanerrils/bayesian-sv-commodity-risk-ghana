name: stationary-h0-attempt2-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        commodity: [cocoa, oil]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Run production-policy attempt 2
        run: >-
          python scripts/diagnose_sv_refit.py
          --commodity "${{ matrix.commodity }}"
          --variant SV-t
          --block 0
          --attempt 2
          --window 1000
          --refit-every 42
          --target-accept 0.99
          --allow-nonconverged
          --output-dir diagnostics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stationary-h0-${{ matrix.commodity }}-sv-t-attempt2
          path: diagnostics/
          if-no-files-found: error
          retention-days: 30
