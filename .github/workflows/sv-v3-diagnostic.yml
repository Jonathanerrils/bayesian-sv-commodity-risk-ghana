name: sv-v3-convergence-diagnostic

on:
  # This synchronize trigger is temporary for the validation gate.  Once this
  # expanded matrix has completed, return the workflow to manual-only so later
  # paper/benchmark commits do not re-run production-scale MCMC diagnostics.
  pull_request:
    types: [synchronize]
    paths:
      - '.github/workflows/sv-v3-diagnostic.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          # Previously failed under the old sampler; block 0 now passes v3.
          - commodity: cocoa
            variant: SV-Gaussian
            block: 24
          # Heavy-tail/leverage representative on cocoa.
          - commodity: cocoa
            variant: SV-t-Leverage
            block: 0
          # Heavy-tail representative on gold.
          - commodity: gold
            variant: SV-t
            block: 0
          # Pure leverage representative so every SV family is explicitly tested.
          - commodity: gold
            variant: SV-Leverage
            block: 0
          # Oil is the empirically hardest commodity; test both a simple and the
          # richest specification before freezing inference.
          - commodity: oil
            variant: SV-Gaussian
            block: 0
          - commodity: oil
            variant: SV-t-Leverage
            block: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Run production-scale refit diagnostic
        run: >-
          python scripts/diagnose_sv_refit.py
          --commodity "${{ matrix.commodity }}"
          --variant "${{ matrix.variant }}"
          --block "${{ matrix.block }}"
          --window 1000
          --refit-every 42
          --output-dir diagnostics
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sv-v3-${{ matrix.commodity }}-${{ matrix.variant }}-block-${{ matrix.block }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 30
