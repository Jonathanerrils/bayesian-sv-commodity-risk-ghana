name: gold-sv-gaussian-geometry-diagnostic

on:
  pull_request:
    paths:
      - '.github/run-gold-sv-gaussian-geometry'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Diagnose Gold SV-Gaussian attempt 2 geometry
        run: >-
          python scripts/diagnose_sv_refit.py
          --commodity gold
          --variant SV-Gaussian
          --block 0
          --window 1000
          --refit-every 42
          --target-accept 0.99
          --attempt 2
          --allow-nonconverged
          --output-dir diagnostics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-sv-gaussian-attempt2-geometry
          path: diagnostics/
          if-no-files-found: error
          retention-days: 30
