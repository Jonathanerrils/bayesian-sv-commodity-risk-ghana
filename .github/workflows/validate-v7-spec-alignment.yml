name: Validate v7 production spec alignment

on:
  push:
    branches:
      - fix/v7-production-spec-alignment

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests/test_runner_config.py tests/test_sv_variant_specific_geometry.py tests/test_sv_ess_resampling.py tests/test_production_provenance.py tests/test_production_distribution.py
