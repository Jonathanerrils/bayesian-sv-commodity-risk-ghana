name: Validate diagnostic workflow patch

on:
  push:
    branches:
      - fix/sv-diagnostic-attempt-budget

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Compile diagnostic script
        run: python -m py_compile scripts/diagnose_sv_refit.py
      - name: Run targeted lightweight tests
        run: python -m pytest -q tests/test_runner_config.py tests/test_checkpoint_safety.py
