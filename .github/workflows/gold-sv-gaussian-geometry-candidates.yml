name: gold-sv-gaussian-geometry-candidates

on:
  pull_request:
    paths:
      - '.github/run-gold-sv-gaussian-geometry-candidates'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        geometry:
          - centered-h0
          - logit-phi
          - centered-h0-logit-phi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Run Gold SV-Gaussian geometry candidate
        run: >-
          python scripts/diagnose_gaussian_geometry_candidates.py
          --geometry "${{ matrix.geometry }}"
          --commodity gold
          --block 0
          --window 1000
          --refit-every 42
          --target-accept 0.99
          --attempt 2
          --output-dir diagnostics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-sv-gaussian-${{ matrix.geometry }}-attempt2
          path: diagnostics/
          if-no-files-found: error
          retention-days: 30
