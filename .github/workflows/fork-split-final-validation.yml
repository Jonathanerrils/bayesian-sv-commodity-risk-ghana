name: Fork split final validation

on:
  push:
    branches:
      - fix/sv-diagnostic-attempt-budget

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile scripts/diagnose_sv_refit.py scripts/summarize_sv_split_attempts.py
      - run: python -m pytest -q tests/test_sv_split_summary.py
