name: sv-gaussian-asis-reference

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        commodity: [cocoa, gold, oil]
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::stochvol
            any::coda
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install 'numpy<2.5,>=1.26' 'pandas<3.0,>=2.0' 'arviz<1.0,>=0.20'
      - name: Run Gaussian ASIS reference
        run: >-
          Rscript scripts/diagnose_sv_gaussian_asis_reference.R
          --commodity "${{ matrix.commodity }}"
          --window 1000
          --output-dir diagnostics/asis_gaussian
      - name: Summarize and reweight to production sigma prior
        run: >-
          python scripts/summarize_sv_gaussian_asis_reference.py
          --commodity "${{ matrix.commodity }}"
          --input-dir diagnostics/asis_gaussian
          --output-dir diagnostics/asis_gaussian
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sv-gaussian-asis-reference-${{ matrix.commodity }}
          path: diagnostics/asis_gaussian/
          if-no-files-found: warn
          retention-days: 30
