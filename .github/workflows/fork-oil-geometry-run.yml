name: fork-oil-sv-t-geometry-control

on:
  push:
    branches:
      - audit/sv-divergence-geometry
    paths:
      - '.github/run-fork-oil-geometry'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile scripts/diagnose_sv_refit.py
      - run: python -m pytest -q tests/test_sv_diagnostic_geometry.py

  oil_sv_t:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Run clean Oil SV-t control
        run: >-
          python scripts/diagnose_sv_refit.py
          --commodity oil
          --variant SV-t
          --block 0
          --attempt 1
          --window 1000
          --refit-every 42
          --target-accept 0.99
          --allow-nonconverged
          --output-dir diagnostics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: divergence-geometry-oil-SV-t-attempt-1
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 30
