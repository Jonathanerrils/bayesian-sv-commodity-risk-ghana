name: ess-filter-threshold-validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - commodity: cocoa
            variant: SV-Gaussian
            block: 0
          - commodity: gold
            variant: SV-t
            block: 0
          - commodity: oil
            variant: SV-t
            block: 0
          - commodity: oil
            variant: SV-Gaussian
            block: 0
          - commodity: cocoa
            variant: SV-Gaussian
            block: 1
          - commodity: oil
            variant: SV-t
            block: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Compare 25/50/75 percent ESS thresholds
        run: >-
          python scripts/compare_sv_filter_thresholds.py
          --commodity "${{ matrix.commodity }}"
          --variant "${{ matrix.variant }}"
          --block "${{ matrix.block }}"
          --window 1000
          --refit-every 42
          --target-accept 0.99
          --thresholds 0.25 0.5 0.75
          --predictive-draws 20000
          --output-dir diagnostics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ess-threshold-${{ matrix.commodity }}-${{ matrix.variant }}-block-${{ matrix.block }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 30
