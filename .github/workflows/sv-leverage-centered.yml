name: sv-leverage-centered

on:
  pull_request:
    paths:
      - 'scripts/diagnose_sv_leverage_centered.py'
      - '.github/workflows/sv-leverage-centered.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        case: [oil, synthetic]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Run centered leverage diagnostic
        run: >-
          python scripts/diagnose_sv_leverage_centered.py
          --case "${{ matrix.case }}"
          --window 1000
          --output-dir diagnostics
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sv-leverage-centered-${{ matrix.case }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 30
