name: variant-specific-sv-production-candidate

on:
  pull_request:
    paths:
      - '.github/run-promoted-gaussian-logitphi-validation'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - commodity: cocoa
            variant: SV-t
          - commodity: gold
            variant: SV-t
          - commodity: oil
            variant: SV-t
          - commodity: cocoa
            variant: SV-Gaussian
          - commodity: gold
            variant: SV-Gaussian
          - commodity: oil
            variant: SV-Gaussian
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Validate production candidate
        run: >-
          python scripts/compare_sv_filter_thresholds.py
          --commodity "${{ matrix.commodity }}"
          --variant "${{ matrix.variant }}"
          --block 0
          --window 1000
          --refit-every 42
          --target-accept 0.99
          --thresholds 0.5
          --predictive-draws 20000
          --output-dir diagnostics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-${{ matrix.commodity }}-${{ matrix.variant }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 30
